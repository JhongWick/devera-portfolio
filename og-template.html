<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 627px; overflow: hidden; }
  body {
    background: #0a0d12;
    color: #e6e9ef;
    font-family: "Public Sans", sans-serif;
    position: relative;
  }
  .grid-bg {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(232,161,60,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,161,60,0.05) 1px, transparent 1px);
    background-size: 56px 56px;
  }
  .glow {
    position: absolute; top: -220px; right: -160px;
    width: 640px; height: 640px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,161,60,0.14), transparent 65%);
  }
  .frame {
    position: absolute; inset: 26px;
    border: 1px solid rgba(232,161,60,0.28);
  }
  .corner { position: absolute; width: 14px; height: 14px; border: 2px solid #e8a13c; }
  .corner.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
  .corner.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
  .corner.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }
  .content {
    position: absolute; inset: 26px;
    padding: 62px 72px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .kicker {
    font-family: "IBM Plex Mono", monospace;
    font-size: 19px; letter-spacing: 0.24em; color: #e8a13c;
  }
  .name {
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: 92px; line-height: 1.04; letter-spacing: -0.01em;
  }
  .name .accent { color: #e8a13c; }
  .tagline {
    font-size: 25px; font-weight: 300; color: #9aa3b2;
    max-width: 760px; line-height: 1.45; margin-top: 26px;
  }
  .tagline strong { color: #e6e9ef; font-weight: 500; }
  .bottom {
    display: flex; align-items: flex-end; justify-content: space-between;
    border-top: 1px solid rgba(230,233,239,0.14); padding-top: 30px;
  }
  .stats { display: flex; gap: 64px; }
  .stat-num {
    font-family: "Fraunces", serif; font-weight: 600;
    font-size: 44px; color: #e6e9ef;
  }
  .stat-num sup { color: #e8a13c; font-size: 26px; }
  .stat-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #9aa3b2; margin-top: 8px;
  }
  .url {
    font-family: "IBM Plex Mono", monospace;
    font-size: 16px; letter-spacing: 0.1em; color: #e8a13c;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div>
  <div class="corner bl"></div><div class="corner br"></div>
  <div class="content">
    <div>
      <p class="kicker">// SOFTWARE DEVELOPER — RIZAL, PHILIPPINES</p>
      <h1 class="name" style="margin-top:22px;">Orlando De Vera <span class="accent">Jr.</span></h1>
      <p class="tagline">Building the digital backbone of Philippine public service —
      <strong>C# · .NET Core · JavaScript · WordPress</strong></p>
    </div>
    <div class="bottom">
      <div class="stats">
        <div class="stat">
          <div class="stat-num">11<sup>+</sup></div>
          <div class="stat-label">Years writing<br/>for the web</div>
        </div>
        <div class="stat">
          <div class="stat-num">10<sup>+</sup></div>
          <div class="stat-label">Gov systems<br/>built &amp; maintained</div>
        </div>
        <div class="stat">
          <div class="stat-num">8<sup>+</sup></div>
          <div class="stat-label">Years in<br/>.NET Core</div>
        </div>
      </div>
      <p class="url">jhongwick.github.io/devera-portfolio</p>
    </div>
  </div>
</body>
</html>
